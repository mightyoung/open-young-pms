version: '3.8'

# PMS 开发/演示环境 docker-compose
#
# 基础设施说明（2026-03-26 确认）：
#   PostgreSQL+pgvector  192.168.1.2:45041  （已连通 ✅）
#   Redis               192.168.1.2:40967  （DB 3，已连通 ✅）
#   远程服务通过环境变量连接，本地不再启动 db/redis 容器
#
# 生产切换：修改 USE_SQLITE=false，DATABASE_URL 指向生产 PostgreSQL

services:
  # rustfs — 本地 S3 兼容对象存储
  # 说明：替换为你内部 rustfs Docker 镜像地址即可
  # 示例（临时用 LocalStack 社区版替代，S3 API 完全兼容）：
  rustfs:
    image: localstack/localstack-community:latest
    container_name: pms-rustfs
    environment:
      - SERVICES=s3
      - PERSISTENCE=1
      - HOST_TMP_FOLDER=/tmp/localstack
    volumes:
      - rustfs_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4566:4566"          # LocalStack S3 API
      - "4510-4559:4510-4559"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # 后端服务
  backend:
    build: .
    container_name: pms-backend
    ports:
      - "8001:8001"
    environment:
      # SQLite 演示模式（当前第 1-2 周）
      USE_SQLITE: "true"
      # PostgreSQL + pgvector（后续阶段启用）
      # DATABASE_URL: postgresql+asyncpg://postgres:postgres@192.168.1.2:45041/bs_generator_db
      # Redis（后续阶段启用，redis.asyncio）
      # REDIS_URL: redis://192.168.1.2:40967/3
      # S3 / rustfs（后续阶段启用）
      # S3_ENDPOINT: http://rustfs:4566
      # S3_BUCKET: pms-media
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

  # 前端开发服务
  frontend:
    image: node:20-alpine
    container_name: pms-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../src:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  rustfs_data:
