name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for architecture guard diffs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{js,jsx,css}"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bundle size baseline
        run: npm run bundle-check

      - name: Run smoke tests
        run: npm run test

      - name: Guard legacy pages
        run: |
          # Frozen: src/pages/ (legacy). New pages must go in src/features/
          BASE_REF=${GITHUB_BASE_REF:-main}
          NEW_FILES=$(git diff --name-only "$BASE_REF...HEAD" -- 'src/pages/*.jsx' | grep -v '^$' || true)
          if [ -n "$NEW_FILES" ]; then
            echo "ERROR: Cannot add new files to src/pages/ (frozen directory)"
            echo "New files: $NEW_FILES"
            echo "Create pages in src/features/ instead"
            exit 1
          fi
          echo "✓ No new files added to src/pages/"

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for architecture guard diffs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt ruff

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Guard legacy routers
        run: |
          # Frozen: backend/routers/ (Layer 2). New endpoints must go in backend/api/routers/
          BASE_REF=${GITHUB_BASE_REF:-main}
          NEW_FILES=$(git diff --name-only "$BASE_REF...HEAD" -- 'routers/*.py' | grep -v '^$' || true)
          if [ -n "$NEW_FILES" ]; then
            echo "ERROR: Cannot add new files to backend/routers/ (frozen Layer 2)"
            echo "New files: $NEW_FILES"
            echo "Create routers in backend/api/routers/ instead"
            exit 1
          fi
          echo "✓ No new files added to backend/routers/"

      - name: Backend tests
        env:
          JWT_SECRET: test-secret-for-ci-only-min-32-chars
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short
